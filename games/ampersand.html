<!doctype html>
<html lang="en-US">

    <meta charset="utf-8" />
    <title>Ampersand Quest</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      canvas {
        display: block;
        margin: 0 auto;
      }
    </style>

  <body>
    <img id="sprite" src="spritesheet.png" style="display:none">
    <img id="title" src="titlescreen.png" style="display:none">
    <img id="win_page" src="win_page.png" style="display:none">
    <canvas id="myCanvas"></canvas>

<script>
const canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");

var sprite = document.getElementById("sprite");
var title = document.getElementById("title");
var win_title = document.getElementById("win_page");

var music = new Audio('game.ogg');
var levels = 5;
var moves = 0;
var score = 0;

let map_time = [60,30,150,10,30,75];
let map_fog = [0,1,1,1,0,0];

let map = ["pray there will be ampersands today"];
let player_x = 0;
let player_y = 0;
let player_keys = [0,0,0];
let fog = true;

let ampersands = 0;
let level = 0;
let timer = 0;
let win_page = false;
let can_move = false;

let titlescreen = true;
let lastkeypress = ".";

function keyDownHandler(e) {
  if (titlescreen == true) {
      return;
  }
  lastkeypress = e.key;
  switch (e.key) {
    case "ArrowLeft":
        moveplayer(player_x-1,player_y);
        break;
    case "ArrowRight":
        moveplayer(player_x+1,player_y);
        break;
    case "ArrowUp":
        moveplayer(player_x,player_y-1);
        break;
    case "ArrowDown":
        moveplayer(player_x,player_y+1);
        break;
  }
  draw();
}

function changemaptile(x,y,chr) {
    map[y] = map[y].substring(0,x) + chr + map[y].substring(x+1);
}

function moveplayer(x,y) {
  if (titlescreen == true) return;
  if (can_move == false) return;
  if (y > 16 || x > 32) return;
  if (y < 0 || x < 0) return;
  
  let tile = map[y].charAt(x);
  if (tile === "#" || tile === "3") {
      return;
  }
  else if (tile === "h") {
      return;
  }
  else if (tile === "%") {
      killplayer();
      return;
  }
  else if (tile === "@") {
      let dx = x-player_x;
      let dy = y-player_y;
      let bx = x+dx;
      let by = y+dy;
      if (bx > 0 && by > 0 && bx < 32 && by < 16) {
          if (map[by].charAt(bx) === ".") {
              changemaptile(x,y,".");
              changemaptile(bx,by,"@");
              var sfx = new Audio('boulder.ogg');
              sfx.play();
          }
          else if (map[by].charAt(bx) === "h") {
              changemaptile(x,y,".");
              changemaptile(bx,by,"f");
              var sfx = new Audio('boulder.ogg');
              sfx.play();
          }
          else if (map[by].charAt(bx) === "%") {
              changemaptile(x,y,".");
              score = score + 400;
              var sfx = new Audio('burn.ogg');
              sfx.play();
          }
          else {
              return;
          }
      }
  }
  else if (tile === "&") {
      if (getampersand(x,y)) return;
  }
  else if (tile === "T") {
      teleport(x,y);
      return;
  }
  else if (tile === "G") {
      getkey(x,y,2);
  }
  else if (tile === "B") {
      getkey(x,y,1);
  }
  else if (tile === "R") {
      getkey(x,y,0);
  }
  else if (tile === "g") {
      if (player_keys[2] == 1) {
          open_door(x,y);
      }
      else {
          return;
      }
  }
  else if (tile === "b") {
      if (player_keys[1] == 1) {
          open_door(x,y);
      }
      else {
          return;
      }
  }
  else if (tile === "r") {
      if (player_keys[0] == 1) {
          open_door(x,y);
      }
      else {
          return;
      }
  }
  player_x = x;
  player_y = y;
}

function teleport(x,y) {
    var sfx = new Audio('torb.ogg');
    sfx.play();
    for (let i = 0; i < 16; i++) {
      for (let j = 0; j < 32; j++) {
        if (map[i].charAt(j) === "T") {
          if (!(x == j && y == i)) {
            player_x = j;
            player_y = i;
            return;
          }
        }
      }
    }
}

function open_door(x,y) {
    var sfx = new Audio('door.ogg');
    sfx.play();
    changemaptile(x,y,"d");
}

function clickHandler(e) {
    if (titlescreen == true) {
        setup();
    }
    editor(e);
}

let edit = false;

function editor(e) {
    if (edit != true) return;
    if (!(event.buttons & 1)) return;
    let ww = canvas.width/32;
    let wh = canvas.height/16;
    if (lastkeypress === "$") {
        player_x = Math.floor(e.clientX/ww);
        player_y = Math.floor(e.clientY/wh);
    }
    else changemaptile(Math.floor(e.clientX/ww),Math.floor(e.clientY/wh),lastkeypress[0]);
    
    console.log("Map:");
    var mapstr = "";
    for (let i = 0; i < 16; i++) {
        mapstr = mapstr + "\"" + map[i] + "\",\n";
    }
    
    console.log(mapstr);
    
    draw();
}

function killplayer() {
    titlescreen = true;
    music.pause();
    music.currentTime = 0;
    var sfx = new Audio('die.ogg');
    sfx.play();
    score = 0;
}

function getkey(x,y,type) {
    var sfx = new Audio('key.ogg');
    sfx.play();
    changemaptile(x,y,".");
    player_keys[type] = 1;
    score = score + 800;
}

function getampersand(x,y) {
    changemaptile(x,y,".");
    ampersands = ampersands - 1;
    score = score + 1000;
    if (ampersands <= 0) {
        score += timer * 15;
        level = level + 1;
        setup();
        var sfx = new Audio('pass.ogg');
        sfx.play();
        return true;
    }
    var sfx = new Audio('trand.ogg');
    sfx.play();
    return false;
}

document.addEventListener("keydown", keyDownHandler);
canvas.addEventListener("click", clickHandler);
canvas.addEventListener("mousemove", editor);

function setup() {
  if (level > levels) {
      titlescreen = true;
      win_page = true;
      music.pause();
      music.currentTime = 0;
      return;
  }
  timer = map_time[level];
  map = maps[level].slice();
  fog = map_fog[level];
  can_move = false;
  player_keys = [0,0,0];
  ampersands = 0;
  for (let i = 0; i < 16; i++) {
      for (let j = 0; j < 32; j++) {
          if (map[i].charAt(j) === "$") {
              player_x = j;
              player_y = i;
          }
          if (map[i].charAt(j) === "&") {
              ampersands = ampersands + 1;
          }
      }
  }
  if (titlescreen == true) music.currentTime = 4;
  else music.currentTime = 0;
  music.play();
  titlescreen = false;
}

function clock_tick() {
  if (titlescreen == true) {
      return;
  }
  timer--;
  can_move = true;
  if (timer <= 0) killplayer();
}

function draw() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  
  if (titlescreen == true) {
      if (win_page == true) {
          ctx.drawImage(win_title,0,0,canvas.width,canvas.height);
          ctx.font = "50px Impact,fantasy";
          ctx.fillStyle = "white";
          let score_display = `${score} score`;
          ctx.lineWidth = 4;
          ctx.strokeText(score_display,0,50);
          ctx.fillText(score_display,0,50);
      }
      else ctx.drawImage(title,0,0,canvas.width,canvas.height);
      return;
  }
  
  canvas.fillstyle = "black";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  let ww = canvas.width/32;
  let wh = canvas.height/16;
  
  for (let i = 0; i < 16; i++) {
      for (let j = 0; j < 32; j++) {
          let rx = Math.floor(j * ww);
          let ry = Math.floor(i * wh);
          let rh = Math.ceil(wh);
          let rw = Math.ceil(ww);
          
          if (map[i].charAt(j) === "#") {
              ctx.drawImage(sprite,0,0,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "3") {
              ctx.drawImage(sprite,48,0,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "%") {
              ctx.drawImage(sprite,0,16,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "&") {
              ctx.drawImage(sprite,16,0,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "d") {
              ctx.drawImage(sprite,16,16,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "G") {
              ctx.drawImage(sprite,32,48,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "B") {
              ctx.drawImage(sprite,16,48,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "R") {
              ctx.drawImage(sprite,0,48,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "g") {
              ctx.drawImage(sprite,32,32,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "b") {
              ctx.drawImage(sprite,16,32,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "r") {
              ctx.drawImage(sprite,0,32,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "@") {
              ctx.drawImage(sprite,32,16,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "T") {
              ctx.drawImage(sprite,48,16,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "h") {
              ctx.drawImage(sprite,48,32,16,16,rx, ry, rw, rh);
          }
          else if (map[i].charAt(j) === "f") {
              ctx.drawImage(sprite,48,48,16,16,rx, ry, rw, rh);
          }
          
          if (fog == true) {
              let alpha = Math.hypot(player_x-j,player_y-i) / 8;
              ctx.fillStyle = `rgba(76,89,99,${alpha})`;
              ctx.fillRect(rx,ry,rw,rh);
          }
      }
  }
  
  ctx.drawImage(sprite,32,0,16,16,player_x * ww, player_y * wh, ww, wh);
  
  ctx.font = "30px Papyrus,fantasy";
  ctx.fillStyle = "white";
  let info = `${ampersands} ampersands remain...`;
  let score_display = `${score} score`;
  if (ampersands == 1) info = `${ampersands} ampersand remains...`;
  let timerdisplay = `${Math.floor(timer/60)}:${String(timer%60).padStart(2, '0')}`;
  ctx.lineWidth = 4;
  ctx.strokeText(score_display,0,30);
  ctx.fillText(score_display,0,30);
  ctx.strokeText(info,0,60);
  ctx.fillText(info,0,60);
  ctx.strokeText(timerdisplay,0,90);
  ctx.fillText(timerdisplay,0,90);
}
setInterval(draw, 500);
setInterval(clock_tick,1000);

</script>

</html>
